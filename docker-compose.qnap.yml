# Riferimento sanitizzato per confronto: non sovrascrive il Compose QNAP attivo.
# Preservare sempre servizi, segreti, mount, porte, reti, label e impostazioni reali.
services:
  paperless-mcp:
    image: ghcr.io/barryw/paperlessmcp:v0.3.2
    container_name: paperless-mcp
    pull_policy: always
    environment:
      PAPERLESS_BASE_URL: "${PAPERLESS_BASE_URL}"
      PAPERLESS_API_TOKEN: "${PAPERLESS_API_TOKEN}"
      MAX_DOWNLOAD_SIZE_BYTES: ${MAX_DOWNLOAD_SIZE_BYTES:-10485760}
      MCP_PORT: "5000"
      HTTP_TIMEOUT_SECONDS: "60"
    networks:
      - qnap-network
    restart: unless-stopped
    labels:
      - diun.enable=true

  plex-mcp:
    image: ghcr.io/gipasoft/plex-mcp-server:latest
    container_name: plex-mcp
    pull_policy: always
    env_file:
      - .env
    volumes:
      - ./config.json:/config/config.json:ro
      - ./bin/trilium-mcp:/usr/local/bin/trilium-mcp:ro
    ports:
      - "9097:9090"
    command: ["-config", "/config/config.json"]
    networks:
      - qnap-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 9090), 5).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - diun.enable=true

networks:
  qnap-network:
    external: true
