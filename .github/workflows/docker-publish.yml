name: Docker

on:
  push:
    branches:
      - main
      - "fix/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gipasoft/plex-mcp-server
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  verify:
    name: Test, audit, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Build TypeScript
        run: npm run build

  pull-request-image:
    name: Build and smoke-test pull request image
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/fix/'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: plex-mcp-server:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test candidate
        run: node scripts/smoke-test-image.mjs plex-mcp-server:pr

  publish:
    name: Build, smoke-test, and publish container
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.published.outputs.digest }}
      immutable_reference: ${{ steps.published.outputs.immutable_reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and load candidate with publication tags
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select smoke-test image
        id: candidate
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          SMOKE_IMAGE="$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')"
          test -n "$SMOKE_IMAGE"
          docker image inspect "$SMOKE_IMAGE" >/dev/null
          echo "image=$SMOKE_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Smoke test candidate
        run: node scripts/smoke-test-image.mjs "${{ steps.candidate.outputs.image }}"

      - name: Push exact tested local tags and record digest
        id: published
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          PUBLISHED_DIGEST=""

          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker image inspect "$tag" >/dev/null

            if ! PUSH_OUTPUT="$(docker push "$tag" 2>&1)"; then
              printf '%s\n' "$PUSH_OUTPUT" >&2
              exit 1
            fi
            printf '%s\n' "$PUSH_OUTPUT"

            TAG_DIGEST="$(
              printf '%s\n' "$PUSH_OUTPUT" |
                sed -nE 's/^.*digest: (sha256:[0-9a-f]{64})([[:space:]].*)?$/\1/p' |
                tail -n 1
            )"
            if ! printf '%s\n' "$TAG_DIGEST" |
              grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "Digest mancante o non valido per $tag" >&2
              exit 1
            fi

            if [[ -z "$PUBLISHED_DIGEST" ]]; then
              PUBLISHED_DIGEST="$TAG_DIGEST"
            elif [[ "$TAG_DIGEST" != "$PUBLISHED_DIGEST" ]]; then
              echo "Digest non coerente per $tag: $TAG_DIGEST (atteso $PUBLISHED_DIGEST)" >&2
              exit 1
            fi
          done <<< "$IMAGE_TAGS"

          test -n "$PUBLISHED_DIGEST"
          IMMUTABLE_REFERENCE="${REGISTRY}/${IMAGE_NAME}@${PUBLISHED_DIGEST}"
          echo "digest=$PUBLISHED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "immutable_reference=$IMMUTABLE_REFERENCE" >> "$GITHUB_OUTPUT"
          {
            echo "### Immagine GHCR pubblicata"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Tag correlato: \`sha-${GITHUB_SHA::7}\`"
            echo "- Digest manifest: \`${PUBLISHED_DIGEST}\`"
            echo "- Riferimento immutabile: \`${IMMUTABLE_REFERENCE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
